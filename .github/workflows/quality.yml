name: Quality and native regression

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: dom, xml, xmlreader, tokenizer, mbstring
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer standards
      - name: Install verified WP-CLI for native catalogue extraction
        run: bash tools/setup-wp-cli.sh
      - name: Compare every shipped language with native WordPress string extraction
        run: |
          wp i18n make-pot . "$RUNNER_TEMP/rocketsky-antispam-native.pot" --slug=rocketsky-antispam --domain=rocketsky-antispam --exclude=vendor,tests,tools,docs,.git,node_modules --package-name='Rocketsky Antispam'
          python3 tools/check-translations.py --pot "$RUNNER_TEMP/rocketsky-antispam-native.pot" --languages languages
      - name: Check JavaScript syntax
        run: |
          node --check assets/admin.js
          node --check assets/protection.js
          node --check assets/woocommerce-checkout.js

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        wordpress: ['latest']
        include:
          - php: '8.2'
            wordpress: '6.6'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: rocketsky_antispam_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RKTSKY_ANTISPAM_ALLOW_TESTS: '1'
      RKTSKY_ANTISPAM_WP_ROOT: /tmp/rocketsky-antispam-wordpress
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: none
          coverage: none
      - name: Install verified WP-CLI
        run: bash tools/setup-wp-cli.sh
      - name: Install a disposable native WordPress site
        env:
          ANTISPAM_TEST_WP_VERSION: ${{ matrix.wordpress }}
          ANTISPAM_TEST_PHP_VERSION: ${{ matrix.php }}
        run: |
          wp core download --path="$RKTSKY_ANTISPAM_WP_ROOT" --version="$ANTISPAM_TEST_WP_VERSION"
          wp config create --path="$RKTSKY_ANTISPAM_WP_ROOT" --dbname=rocketsky_antispam_test --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set RKTSKY_ANTISPAM_TEST_FIXTURE true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$RKTSKY_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core install --path="$RKTSKY_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic Rocketsky Antispam tests' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          if [ "$ANTISPAM_TEST_WP_VERSION" = latest ]; then
            wp plugin install wpforms-lite --activate --path="$RKTSKY_ANTISPAM_WP_ROOT"
            if [ "$ANTISPAM_TEST_PHP_VERSION" != '8.2' ]; then
              wp plugin install contact-form-7 --activate --path="$RKTSKY_ANTISPAM_WP_ROOT"
              wp plugin install flamingo --activate --path="$RKTSKY_ANTISPAM_WP_ROOT"
            fi
          fi
          ln -s "$GITHUB_WORKSPACE" "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/plugins/rocketsky-antispam"
          wp plugin activate rocketsky-antispam --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX ); add_filter( "pre_http_request", static function () { return new WP_Error( "test_http_blocked", "Disposable fixture." ); }, PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
      - run: php tests/native.php
      - run: php tests/timezones.php
      - if: matrix.wordpress == 'latest' && matrix.php == '8.5'
        run: php tests/email.php
      - run: php tests/native-admin.php
      - run: php tests/context-notices.php
      - run: php tests/translations.php
      - run: php tests/native-spam-routing.php
      - run: php tests/registration.php
      - run: php tests/theme-registry.php
      - run: php tests/provider-divi.php
      - run: php tests/native-pings.php
      - run: php tests/quarantine.php
      - run: php tests/policies.php
      - run: php tests/dashboard.php
      - run: php tests/pattern-limits.php
      - run: php tests/feedback.php
      - run: php tests/gravity-feedback.php
      - run: php tests/uninstall.php
      - if: matrix.wordpress == 'latest'
        run: php tests/prepare-providers.php
      - if: matrix.wordpress == 'latest'
        run: php tests/native-providers.php
      - if: matrix.wordpress == 'latest'
        run: php tests/native-cf7-spam.php
      - run: php tests/integrations.php
      - run: php tests/content-rules.php

  woocommerce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: rocketsky_antispam_woocommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RKTSKY_ANTISPAM_ALLOW_TESTS: '1'
      RKTSKY_ANTISPAM_WP_ROOT: /tmp/rocketsky-antispam-woocommerce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: none
          coverage: none
      - name: Install verified WP-CLI
        run: bash tools/setup-wp-cli.sh
      - name: Install original WooCommerce on a disposable native WordPress site
        run: |
          wp core download --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config create --path="$RKTSKY_ANTISPAM_WP_ROOT" --dbname=rocketsky_antispam_woocommerce --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set RKTSKY_ANTISPAM_TEST_FIXTURE true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$RKTSKY_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core install --path="$RKTSKY_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic WooCommerce tests' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          wp plugin install woocommerce --activate --path="$RKTSKY_ANTISPAM_WP_ROOT"
          ln -s "$GITHUB_WORKSPACE" "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/plugins/rocketsky-antispam"
          wp plugin activate rocketsky-antispam --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
      - run: php tests/prepare-woocommerce.php
      - run: php tests/native-woocommerce.php

  extra-forms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: rocketsky_antispam_extra_forms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RKTSKY_ANTISPAM_ALLOW_TESTS: '1'
      RKTSKY_ANTISPAM_WP_ROOT: /tmp/rocketsky-antispam-extra-forms
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: none
          coverage: none
      - name: Install verified WP-CLI
        run: bash tools/setup-wp-cli.sh
      - name: Install original free form providers on a disposable native WordPress site
        run: |
          wp core download --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config create --path="$RKTSKY_ANTISPAM_WP_ROOT" --dbname=rocketsky_antispam_extra_forms --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set RKTSKY_ANTISPAM_TEST_FIXTURE true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$RKTSKY_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core install --path="$RKTSKY_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic form provider tests' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          wp plugin install formidable fluentform ws-form --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX ); add_filter( "pre_http_request", static function () { return new WP_Error( "test_http_blocked", "Disposable fixture." ); }, PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp plugin activate formidable fluentform ws-form --path="$RKTSKY_ANTISPAM_WP_ROOT"
          ln -s "$GITHUB_WORKSPACE" "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/plugins/rocketsky-antispam"
          wp plugin activate rocketsky-antispam --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
      - run: php tests/setup-extra-forms.php
      - run: php tests/native-extra-forms.php
      - run: php tests/native-provider-spam.php
      - run: php tests/native-provider-feedback.php
      - run: php tests/adapters-extra-forms.php

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and extract the exact WordPress.org submission archive
        run: |
          python3 tools/build-release.py --channel wordpress-org --output /tmp/rocketsky-antispam-distribution
          python3 - <<'PYBUILD'
          import hashlib, json, zipfile
          from pathlib import Path
          output = Path('/tmp/rocketsky-antispam-distribution')
          manifests = list(output.glob('*-wordpress-org.manifest.json'))
          if len(manifests) != 1:
              raise SystemExit('One exact submission manifest is required.')
          manifest = json.loads(manifests[0].read_text())
          archive = output / manifest['archive']
          if hashlib.sha256(archive.read_bytes()).hexdigest() != manifest['sha256']:
              raise SystemExit('The archive digest differs from the submission manifest.')
          with zipfile.ZipFile(archive) as package:
              if set(package.namelist()) != set(manifest['files']):
                  raise SystemExit('The archive inventory differs from its manifest.')
              for name, digest in manifest['files'].items():
                  if hashlib.sha256(package.read(name)).hexdigest() != digest:
                      raise SystemExit('An archive member differs from its manifest.')
              package.extractall(output)
          PYBUILD
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: /tmp/rocketsky-antispam-distribution/rocketsky-antispam
          slug: rocketsky-antispam
          # Every directory error and warning fails the submission gate.
          strict: true

  browser-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/rocketsky-antispam-browser --no-audit --no-fund --ignore-scripts playwright@1.62.1
          /tmp/rocketsky-antispam-browser/node_modules/.bin/playwright install --with-deps firefox
      - name: Verify native browser challenge and retry behavior
        env:
          RKTSKY_ANTISPAM_PLAYWRIGHT: /tmp/rocketsky-antispam-browser/node_modules/playwright/index.mjs
        run: node tests/browser-bridge.mjs

  multisite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wordpress: '6.6'
          - php: '8.5'
            wordpress: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: rocketsky_antispam_multisite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RKTSKY_ANTISPAM_ALLOW_TESTS: '1'
      RKTSKY_ANTISPAM_WP_ROOT: /tmp/rocketsky-antispam-multisite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: none
          coverage: none
      - name: Install verified WP-CLI
        run: bash tools/setup-wp-cli.sh
      - name: Install a disposable native multisite network
        env:
          ANTISPAM_TEST_WP_VERSION: ${{ matrix.wordpress }}
        run: |
          wp core download --path="$RKTSKY_ANTISPAM_WP_ROOT" --version="$ANTISPAM_TEST_WP_VERSION"
          wp config create --path="$RKTSKY_ANTISPAM_WP_ROOT" --dbname=rocketsky_antispam_multisite --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set RKTSKY_ANTISPAM_TEST_FIXTURE true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$RKTSKY_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core multisite-install --path="$RKTSKY_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic Rocketsky Antispam network' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE" "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/plugins/rocketsky-antispam"
          wp plugin activate rocketsky-antispam --network --path="$RKTSKY_ANTISPAM_WP_ROOT"
      - run: php tests/multisite.php
      - run: php tests/context-notices.php

  native-rename:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wordpress: '6.6'
            mode: single
          - php: '8.5'
            wordpress: 'latest'
            mode: single
          - php: '8.2'
            wordpress: '6.6'
            mode: multisite
          - php: '8.5'
            wordpress: 'latest'
            mode: multisite
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: rocketsky_antispam_rename
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RKTSKY_ANTISPAM_ALLOW_TESTS: '1'
      RKTSKY_ANTISPAM_WP_ROOT: /tmp/rocketsky-antispam-rename-wordpress
      RKTSKY_ANTISPAM_RENAME_OLD_ROOT: /tmp/rocketsky-antispam-rename-original
      RKTSKY_ANTISPAM_RENAME_STATE: /tmp/rocketsky-antispam-rename-private/state.json
      RKTSKY_ANTISPAM_TEST_URL: http://127.0.0.1:8877
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: none
          coverage: none
      - name: Install verified WP-CLI
        run: bash tools/setup-wp-cli.sh
      - name: Restore the actual previous owned release for upgrade tests
        run: |
          git fetch --depth=1 origin 674f4c55713e5f14377ece3f49bfe72f4feefd82
          mkdir -p "$RKTSKY_ANTISPAM_RENAME_OLD_ROOT"
          git archive 674f4c55713e5f14377ece3f49bfe72f4feefd82 | tar -x -C "$RKTSKY_ANTISPAM_RENAME_OLD_ROOT"
          mkdir -m 700 /tmp/rocketsky-antispam-rename-private
      - name: Install an isolated previous-name upgrade fixture
        env:
          ANTISPAM_TEST_WP_VERSION: ${{ matrix.wordpress }}
          ANTISPAM_TEST_MODE: ${{ matrix.mode }}
        run: |
          wp core download --path="$RKTSKY_ANTISPAM_WP_ROOT" --version="$ANTISPAM_TEST_WP_VERSION"
          wp config create --path="$RKTSKY_ANTISPAM_WP_ROOT" --dbname=rocketsky_antispam_rename --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set RKTSKY_ANTISPAM_TEST_FIXTURE true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$RKTSKY_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$RKTSKY_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX ); add_filter( "pre_http_request", static function () { return new WP_Error( "test_http_blocked", "Disposable fixture." ); }, PHP_INT_MAX );' > "$RKTSKY_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          if [ "$ANTISPAM_TEST_MODE" = multisite ]; then
            wp core multisite-install --path="$RKTSKY_ANTISPAM_WP_ROOT" --url="$RKTSKY_ANTISPAM_TEST_URL" --title='Synthetic name transition network' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          else
            wp core install --path="$RKTSKY_ANTISPAM_WP_ROOT" --url="$RKTSKY_ANTISPAM_TEST_URL" --title='Synthetic name transition site' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          fi
      - name: Verify native data preservation and lifecycle conflicts
        env:
          RKTSKY_ANTISPAM_RENAME_NEW_ROOT: ${{ github.workspace }}
        run: php tests/native-rename.php
