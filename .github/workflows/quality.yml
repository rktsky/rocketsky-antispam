name: Quality and native regression

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: dom, xml, xmlreader, tokenizer, mbstring
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer standards
      - name: Check JavaScript syntax
        run: |
          node --check assets/protection.js
          node --check assets/woocommerce-checkout.js

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        wordpress: ['latest']
        include:
          - php: '8.2'
            wordpress: '6.6'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: wp_antispam_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ANTISPAM_ALLOW_TESTS: '1'
      WP_ANTISPAM_WP_ROOT: /tmp/wp-antispam-wordpress
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: wp-cli
          coverage: none
      - name: Install a disposable native WordPress site
        env:
          ANTISPAM_TEST_WP_VERSION: ${{ matrix.wordpress }}
          ANTISPAM_TEST_PHP_VERSION: ${{ matrix.php }}
        run: |
          wp core download --path="$WP_ANTISPAM_WP_ROOT" --version="$ANTISPAM_TEST_WP_VERSION"
          wp config create --path="$WP_ANTISPAM_WP_ROOT" --dbname=wp_antispam_test --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_ANTISPAM_TEST_FIXTURE true --raw --path="$WP_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$WP_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core install --path="$WP_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic WP Antispam tests' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          if [ "$ANTISPAM_TEST_WP_VERSION" = latest ]; then
            wp plugin install wpforms-lite --activate --path="$WP_ANTISPAM_WP_ROOT"
            if [ "$ANTISPAM_TEST_PHP_VERSION" != '8.2' ]; then
              wp plugin install contact-form-7 --activate --path="$WP_ANTISPAM_WP_ROOT"
            fi
          fi
          ln -s "$GITHUB_WORKSPACE" "$WP_ANTISPAM_WP_ROOT/wp-content/plugins/wp-antispam"
          wp plugin activate wp-antispam --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$WP_ANTISPAM_WP_ROOT"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX ); add_filter( "pre_http_request", static function () { return new WP_Error( "test_http_blocked", "Disposable fixture." ); }, PHP_INT_MAX );' > "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
      - run: php tests/native.php
      - run: php tests/registration.php
      - run: php tests/theme-registry.php
      - run: php tests/native-pings.php
      - run: php tests/quarantine.php
      - run: php tests/policies.php
      - run: php tests/pattern-limits.php
      - run: php tests/feedback.php
      - run: php tests/gravity-feedback.php
      - run: php tests/uninstall.php
      - if: matrix.wordpress == 'latest'
        run: php tests/prepare-providers.php
      - if: matrix.wordpress == 'latest'
        run: php tests/native-providers.php
      - run: php tests/integrations.php
      - run: php tests/content-rules.php

  woocommerce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: wp_antispam_woocommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ANTISPAM_ALLOW_TESTS: '1'
      WP_ANTISPAM_WP_ROOT: /tmp/wp-antispam-woocommerce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: wp-cli
          coverage: none
      - name: Install original WooCommerce on a disposable native WordPress site
        run: |
          wp core download --path="$WP_ANTISPAM_WP_ROOT"
          wp config create --path="$WP_ANTISPAM_WP_ROOT" --dbname=wp_antispam_woocommerce --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_ANTISPAM_TEST_FIXTURE true --raw --path="$WP_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$WP_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core install --path="$WP_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic WooCommerce tests' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          wp plugin install woocommerce --activate --path="$WP_ANTISPAM_WP_ROOT"
          ln -s "$GITHUB_WORKSPACE" "$WP_ANTISPAM_WP_ROOT/wp-content/plugins/wp-antispam"
          wp plugin activate wp-antispam --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$WP_ANTISPAM_WP_ROOT"
      - run: php tests/prepare-woocommerce.php
      - run: php tests/native-woocommerce.php

  extra-forms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: wp_antispam_extra_forms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ANTISPAM_ALLOW_TESTS: '1'
      WP_ANTISPAM_WP_ROOT: /tmp/wp-antispam-extra-forms
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: wp-cli
          coverage: none
      - name: Install original free form providers on a disposable native WordPress site
        run: |
          wp core download --path="$WP_ANTISPAM_WP_ROOT"
          wp config create --path="$WP_ANTISPAM_WP_ROOT" --dbname=wp_antispam_extra_forms --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_ANTISPAM_TEST_FIXTURE true --raw --path="$WP_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$WP_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core install --path="$WP_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic form provider tests' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          wp plugin install formidable fluentform ws-form --path="$WP_ANTISPAM_WP_ROOT"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX ); add_filter( "pre_http_request", static function () { return new WP_Error( "test_http_blocked", "Disposable fixture." ); }, PHP_INT_MAX );' > "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp plugin activate formidable fluentform ws-form --path="$WP_ANTISPAM_WP_ROOT"
          ln -s "$GITHUB_WORKSPACE" "$WP_ANTISPAM_WP_ROOT/wp-content/plugins/wp-antispam"
          wp plugin activate wp-antispam --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$WP_ANTISPAM_WP_ROOT"
      - run: php tests/setup-extra-forms.php
      - run: php tests/native-extra-forms.php
      - run: php tests/adapters-extra-forms.php

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare the distribution tree
        run: |
          mkdir -p /tmp/wp-antispam-distribution/wp-antispam
          rsync -a --exclude-from=.distignore ./ /tmp/wp-antispam-distribution/wp-antispam/
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: /tmp/wp-antispam-distribution/wp-antispam
          slug: wp-antispam
          # Expected name and bundled-translation warnings remain visible annotations.
          strict: false

  browser-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/wp-antispam-browser --no-audit --no-fund --ignore-scripts playwright@1.62.1
          /tmp/wp-antispam-browser/node_modules/.bin/playwright install --with-deps firefox
      - name: Verify native browser challenge and retry behavior
        env:
          WP_ANTISPAM_PLAYWRIGHT: /tmp/wp-antispam-browser/node_modules/playwright/index.mjs
        run: node tests/browser-bridge.mjs

  multisite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wordpress: '6.6'
          - php: '8.5'
            wordpress: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: wp_antispam_multisite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_ANTISPAM_ALLOW_TESTS: '1'
      WP_ANTISPAM_WP_ROOT: /tmp/wp-antispam-multisite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, curl, mbstring
          tools: wp-cli
          coverage: none
      - name: Install a disposable native multisite network
        env:
          ANTISPAM_TEST_WP_VERSION: ${{ matrix.wordpress }}
        run: |
          wp core download --path="$WP_ANTISPAM_WP_ROOT" --version="$ANTISPAM_TEST_WP_VERSION"
          wp config create --path="$WP_ANTISPAM_WP_ROOT" --dbname=wp_antispam_multisite --dbuser=root --dbpass=disposable-test-password --dbhost=127.0.0.1:3306
          wp config set WP_ENVIRONMENT_TYPE local --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_ANTISPAM_TEST_FIXTURE true --raw --path="$WP_ANTISPAM_WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ANTISPAM_WP_ROOT"
          wp config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$WP_ANTISPAM_WP_ROOT"
          printf '%s\n' rktsky-antispam-disposable > "$WP_ANTISPAM_WP_ROOT/.rktsky-antispam-fixture"
          mkdir -p "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins"
          printf '%s\n' '<?php add_filter( "pre_wp_mail", "__return_false", PHP_INT_MAX );' > "$WP_ANTISPAM_WP_ROOT/wp-content/mu-plugins/fixture-mail.php"
          wp core multisite-install --path="$WP_ANTISPAM_WP_ROOT" --url=http://127.0.0.1:8877 --title='Synthetic WP Antispam network' --admin_user=antispam-fixture --admin_password=disposable-test-password --admin_email=fixture@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP_ANTISPAM_WP_ROOT/wp-content/plugins/wp-antispam"
          wp plugin activate wp-antispam --network --path="$WP_ANTISPAM_WP_ROOT"
      - run: php tests/multisite.php
